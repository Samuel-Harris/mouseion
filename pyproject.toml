[project]
name = "mouseion"
version = "0.1.0"
description = "Local-first personal knowledge base with SQLite hybrid search and MCP tools."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.9.0",
    "apsw>=3.53.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain-text-splitters>=0.3.8",
    "mcp>=1.16.0",
    "ollama>=0.5.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "pymupdf>=1.25.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.20",
    "rich>=14.0.0",
    "sqlite-vec>=0.1.9",
    "structlog>=25.1.0",
    "tiktoken>=0.9.0",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.389",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[project.scripts]
mouseion = "mouseion.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mouseion"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["mouseion"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportUnusedFunction = false
